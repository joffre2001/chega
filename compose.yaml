services:
  postgres:
    image: postgres:16-alpine
    container_name: chega-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5435:5432"

    volumes:
      - chega_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  frontend:
    image: node:24-alpine
    container_name: chega-frontend
    working_dir: /app

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    ports:
      - "127.0.0.1:5173:5173"

    command:
      - sh
      - -c
      - npm install && npm run dev -- --host 0.0.0.0

    restart: unless-stopped

volumes:
  chega_postgres_data:
  frontend_node_modules: